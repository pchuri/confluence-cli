name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update Homebrew formula (e.g. 1.24.0)'
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - run: npm ci
    - run: npm run lint
    - run: npm test
    
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - run: npm ci
    - name: Run npm audit (production only)
      run: npm audit --audit-level moderate --omit=dev

  publish:
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # npm trusted publishing (OIDC) and provenance
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - run: npm ci
    - run: npm test

    - name: Semantic Release
      id: semantic
      # semantic-release 25 (@semantic-release/npm 13) publishes through npm
      # trusted publishing when it is configured for this package, and falls
      # back to NPM_TOKEN otherwise.
      uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
      with:
        extra_plugins: |
          @semantic-release/exec
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  update-homebrew:
    needs: [publish]
    runs-on: ubuntu-latest
    if: needs.publish.outputs.new_release_published == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    env:
      VERSION: ${{ github.event.inputs.version || needs.publish.outputs.new_release_version }}
    steps:
      - name: Download npm tarball and compute sha256
        id: sha
        timeout-minutes: 22
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: VERSION '${VERSION}' is not a valid semver version" >&2
            exit 1
          fi
          URL="https://registry.npmjs.org/confluence-cli/-/confluence-cli-${VERSION}.tgz"
          # Metadata can appear before the tarball. Retry the actual download,
          # including propagation-related 404s, for approximately 20 minutes.
          if ! curl -fsSL --retry 120 --retry-delay 10 --retry-all-errors \
            --retry-max-time 1200 --connect-timeout 10 --max-time 30 \
            "$URL" -o package.tgz; then
            echo "Failed to download npm tarball from ${URL} after retries" >&2
            exit 1
          fi
          SHA256=$(shasum -a 256 package.tgz | awk '{print $1}')
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: pchuri/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update formula
        env:
          URL: ${{ steps.sha.outputs.url }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          set -e
          sed -i \
            -e "s|url \"https://registry.npmjs.org/confluence-cli/-/confluence-cli-.*\.tgz\"|url \"${URL}\"|" \
            -e "s|sha256 \".*\"|sha256 \"${SHA256}\"|" \
            Formula/confluence-cli.rb
          if ! grep -q "url \"${URL}\"" Formula/confluence-cli.rb; then
            echo "Error: Failed to update url in Homebrew formula" >&2
            exit 1
          fi
          if ! grep -q "sha256 \"${SHA256}\"" Formula/confluence-cli.rb; then
            echo "Error: Failed to update sha256 in Homebrew formula" >&2
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/confluence-cli.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "feat: update confluence-cli to ${VERSION}"
          git push
